<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrar Denuncia - Cusco Reporta</title>

    <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      #mapContainer {
        height: 300px;
        width: 100%;
        border-radius: 8px;
      }
      .fila {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
      }
      .columna {
        flex: 1;
        min-width: 300px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .campo {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      textarea {
        width: 100%;
        min-height: 100px;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        resize: none;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal-content {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        width: 90%;
        max-width: 400px;
      }
      .close-modal {
        float: right;
        cursor: pointer;
        font-size: 18px;
        font-weight: bold;
      }
      .dni-busqueda {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .dni-busqueda input {
        flex: 1;
      }

      .btn-lupa {
        padding: 8px 12px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        background: #eee;
      }

      .btn-lupa i {
        font-size: 16px;
      }
      .resultado-dni {
        margin-top: 10px;
        padding: 10px;
        border-radius: 6px;
        background: #f4f6f8;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="topbar">
      <div class="topbar__logo">
        <img src="../assents/images/CuscoReporta.png" />
      </div>
      <nav class="topbar__menu">
        <a href="index.html">Inicio</a>
        <a href="sobre_nosotros.html">Sobre nosotros</a>
        <a href="ayuda.html">Ayuda</a>
      </nav>
    </header>

    <div class="container" style="display: flex; gap: 20px">
      <!-- SIDEBAR -->
      <aside class="sidebar" style="display: flex; flex-direction: column">
        <div class="sidebar__user">
          <div class="sidebar__avatar"><i class="fa-solid fa-user"></i></div>
          <div class="sidebar__info">
            <h3>Jose Pérez</h3>
            <p>Ciudadano</p>
          </div>
        </div>

        <ul class="sidebar__menu">
          <li>
            <a href="perfil_usuario.html"
              ><i class="fa-solid fa-id-card"></i> Ver perfil</a
            >
          </li>
          <li>
            <a href="ReportarIncidencia.html"
              ><i class="fa-solid fa-pen-to-square"></i> Reportar</a
            >
          </li>
          <li>
            <a class="active" href="registrar_Denuncia.html"
              ><i class="fa-solid fa-triangle-exclamation"></i> Denunciar</a
            >
          </li>
          <li>
            <a href="lista_incidencias.html"
              ><i class="fa-solid fa-list-check"></i> Estado de reportes</a
            >
          </li>
          <li>
            <a href="MapaIncidiencias(Ciudadano).html"
              ><i class="fa-solid fa-map-location-dot"></i> Mapa</a
            >
          </li>
          <li>
            <a href="notificaciones.html"
              ><i class="fa-solid fa-bell"></i> Notificaciones</a
            >
          </li>
        </ul>

        <button class="logout-btn" id="logoutBtn" style="margin-top: auto">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </button>
      </aside>

      <!-- MAIN -->
      <main class="main-content denuncia-form" style="flex: 1">
        <h1>Registrar Denuncia</h1>

        <form id="formDenuncia" class="formulario">
          <div class="fila">
            <!-- COLUMNA IZQUIERDA -->
            <div class="columna">
              <div class="campo">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" />
              </div>

              <div class="campo">
                <label for="departamento">Departamento</label>
                <select id="departamento">
                  <option>Seleccione</option>
                  <option>Cusco</option>
                </select>
              </div>

              <div class="campo">
                <label for="provincia">Provincia</label>
                <select id="provincia">
                  <option>Seleccione</option>
                  <option>Cusco</option>
                </select>
              </div>

              <div class="campo">
                <label for="distrito">Distrito</label>
                <select id="distrito">
                  <option>Seleccione</option>
                  <option>San Sebastián</option>
                  <option>San Jerónimo</option>
                  <option>Cusco</option>
                </select>
              </div>

              <div class="campo">
                <label for="referencia">Referencia</label>
                <input
                  type="text"
                  id="referencia"
                  placeholder="Referencia del lugar"
                />
              </div>

              <div class="campo">
                <label for="tipo_incidente">Tipo de incidente</label>
                <select id="tipo_incidente">
                  <option>Seleccione</option>
                  <option>Accidente</option>
                  <option>Choque</option>
                  <option>Mal estacionamiento</option>
                  <option>Robo</option>
                  <option value="otro">Otro</option>
                </select>
                <input
                  type="text"
                  id="otro_incidente"
                  placeholder="Describa otro tipo de incidente"
                  style="display: none"
                />
              </div>

              <div class="campo">
                <label for="hechos">Descripción de los hechos</label>
                <textarea id="hechos"></textarea>
              </div>
            </div>

            <!-- COLUMNA DERECHA -->
            <div class="columna">
              <div class="campo">
                <label>Ubicar en el mapa</label>
                <div id="mapContainer"></div>
              </div>

              <div class="campo" style="display: flex; gap: 10px">
                <button type="button" class="btn-secundario" id="btnVictima">
                  Datos de la víctima
                </button>
                <button type="button" class="btn-secundario" id="btnDenunciado">
                  Datos del denunciado
                </button>
              </div>

              <div class="campo" style="text-align: center">
                <button type="submit" class="btn-principal">Aceptar</button>
              </div>
            </div>
          </div>
        </form>
      </main>
    </div>

    <!-- MODAL VÍCTIMA -->
    <div class="modal" id="modalVictima">
      <div class="modal-content">
        <span class="close-modal" id="closeVictima">&times;</span>
        <h3>Datos de la víctima</h3>

        <div class="campo">
  <label for="dniVictima">DNI de la víctima</label>

  <div class="dni-busqueda">
    <input
      type="text"
      id="dniVictima"
      maxlength="8"
      placeholder="Ingrese DNI"
    />
    <button type="button" class="btn-lupa">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </div>

  <div class="resultado-dni" id="resultadoVictima" style="display: none"></div>
</div>
        </div>
      </div>
    </div>

<!-- MODAL DENUNCIADO -->
<div class="modal" id="modalDenunciado">
  <div class="modal-content">
    <span class="close-modal" id="closeDenunciado">&times;</span>
    <h3>Datos del denunciado</h3>

    <div class="campo">
      <label for="dniDenunciado">DNI del denunciado</label>
      <div class="dni-busqueda">
        <div
          class="resultado-dni"
          id="resultadoDenunciado"
          style="display: none"
        ></div>

        <input
          type="text"
          id="dniDenunciado"
          maxlength="8"
          placeholder="Ingrese DNI"
        />
        <button type="button" class="btn-lupa">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>
  </div>
</div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============================
   MAPA LEAFLET
============================ */
let map;
let marcador = null;

window.addEventListener("load", () => {
  map = L.map("mapContainer").setView([-13.5171, -71.9784], 15);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
  }).addTo(map);

  map.on("click", (e) => {
    if (marcador) map.removeLayer(marcador);
    marcador = L.marker(e.latlng).addTo(map);
  });

  // 🔴 CLAVE: fuerza render correcto
  setTimeout(() => {
    map.invalidateSize();
  }, 300);
});

/* ============================
   MODALES
============================ */
const modalVictima = document.getElementById("modalVictima");
const modalDenunciado = document.getElementById("modalDenunciado");

document.getElementById("btnVictima").onclick = () => {
  modalVictima.style.display = "flex";
  setTimeout(() => map.invalidateSize(), 300);
};

document.getElementById("btnDenunciado").onclick = () => {
  modalDenunciado.style.display = "flex";
  setTimeout(() => map.invalidateSize(), 300);
};

document.getElementById("closeVictima").onclick = () =>
  (modalVictima.style.display = "none");

document.getElementById("closeDenunciado").onclick = () =>
  (modalDenunciado.style.display = "none");

window.onclick = (e) => {
  if (e.target === modalVictima) modalVictima.style.display = "none";
  if (e.target === modalDenunciado) modalDenunciado.style.display = "none";
};

/* ============================
   TIPO INCIDENTE
============================ */
const tipoSelect = document.getElementById("tipo_incidente");
const otroInput = document.getElementById("otro_incidente");

tipoSelect.addEventListener("change", () => {
  otroInput.style.display = tipoSelect.value === "otro" ? "block" : "none";
});

/* ============================
   CONSULTA DNI (BACKEND)
============================ */
async function buscarDNI_API(inputId, resultadoId) {
  const dni = document.getElementById(inputId).value;
  const resultado = document.getElementById(resultadoId);

  if (!/^\d{8}$/.test(dni)) {
    alert("El DNI debe tener 8 dígitos");
    return;
  }

  resultado.style.display = "block";
  resultado.innerHTML = "Buscando información...";

  try {
    const response = await fetch(`http://127.0.0.1:8000/dni/${dni}`);

    if (!response.ok) throw new Error("Error backend");

    const data = await response.json();

    if (data.error) {
      resultado.innerHTML = `<p style="color:red;">${data.error}</p>`;
      return;
    }

    resultado.innerHTML = `
      <p><strong>DNI:</strong> ${data.dni}</p>
      <p><strong>Nombre completo:</strong><br>${data.nombre_completo}</p>
    `;
  } catch (error) {
    resultado.innerHTML =
      `<p style="color:red;">No se pudo consultar el DNI</p>`;
  }
}

/* ============================
   BOTONES LUPA
============================ */
document
  .querySelector("#modalVictima .btn-lupa")
  .addEventListener("click", () => {
    buscarDNI_API("dniVictima", "resultadoVictima");
  });

document
  .querySelector("#modalDenunciado .btn-lupa")
  .addEventListener("click", () => {
    buscarDNI_API("dniDenunciado", "resultadoDenunciado");
  });

/* ============================
   LOGOUT
============================ */
document.getElementById("logoutBtn").onclick = () => {
  window.location.href = "index.html";
};
</script>
  </body>
</html>
